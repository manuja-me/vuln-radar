name: Release VulnRadar Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri Desktop Package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "VulnRadar ${{ github.ref_name }}"
          releaseBody: "See the assets below to download VulnRadar for your operating system."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  build-arch-package:
    name: Build Arch Linux (.pkg.tar.zst)
    needs: release
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm base-devel git pacman-contrib github-cli binutils curl

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory '*'

      - name: Setup unprivileged build user
        run: |
          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builduser:builduser .

      - name: Build .pkg.tar.zst package
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          su builduser -c "
            git config --global --add safe.directory '*'
            cd packaging/aur/vuln-radar-bin
            sed -i \"s/^pkgver=.*/pkgver=${VERSION}/\" PKGBUILD
            updpkgsums || true
            makepkg -f --nodeps
          "

      - name: Upload .pkg.tar.zst to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory '*'
          PKG_PATH=$(find packaging/aur/vuln-radar-bin -name "*.pkg.tar.zst" ! -name "*-debug-*" | head -n 1)
          if [ -n "$PKG_PATH" ]; then
            echo "Uploading Arch package: $PKG_PATH"
            gh release upload "${{ github.ref_name }}" "$PKG_PATH" --clobber
          else
            echo "No valid .pkg.tar.zst file found!"
            exit 1
          fi

  winget-release:
    name: Publish to WinGet
    needs: release
    runs-on: windows-latest
    steps:
      - name: Check WINGET_TOKEN availability
        id: check-token
        shell: bash
        run: |
          if [ -z "${{ secrets.WINGET_TOKEN }}" ]; then
            echo "::warning ::WINGET_TOKEN secret is not set. Skipping automated WinGet submission."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Submit package to Windows Package Manager
        if: steps.check-token.outputs.has_token == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: manuja-me.VulnRadar
          installers-regex: 'VulnRadar_.*_x64-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}


