<!doctype html>
<html lang="en" data-theme="swiss-dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VulnRadar — Security Posture & Vulnerability Scanner</title>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem("vulnradar_theme");
          if (savedTheme === "swiss-light" || savedTheme === "swiss-dark") {
            document.documentElement.setAttribute("data-theme", savedTheme);
          }
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="desktop-select-none">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
